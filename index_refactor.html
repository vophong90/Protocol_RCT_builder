<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Wizard Đề cương RCT — Refactor Shell</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Chỉ áp dụng cho shell refactor -->
  <link rel="stylesheet" href="./public/css/theme.css" />
  <link rel="stylesheet" href="./public/css/components.css" />
</head>
<body>
  <div class="app" id="app">
    <aside id="sidebar">
      <div class="brand">
        <img src="./public/brand/logo.svg" alt="Logo" />
        <h1>Wizard Đề cương RCT</h1>
      </div>
      <button id="toggle-nav" class="collapse" type="button">◀ Ẩn/Hiện tab</button>
      <nav id="nav"></nav>
    </aside>

    <main id="main">
      <div class="topbar">
        <div class="title" id="page-title"></div>
        <div class="actions">
          <button id="open-menu" class="menuBtn" type="button">☰ Menu</button>
          <span class="pill" id="brand-pill">Brand <span class="brand-dot"></span></span>
        </div>
      </div>

      <!-- Router outlet (sẵn 3 step mẫu để test) -->
      <section id="step-0"  class="step"><div class="card" id="step-0-body"></div></section>
      <section id="step-5"  class="step"><div class="card" id="step-5-body"></div></section>
      <section id="step-15" class="step"><div class="card" id="step-15-body"></div></section>

      <div id="modal-root" class="hidden"></div>
      <div id="toast-root" class="hidden"></div>
    </main>
  </div>

  <script type="module" src="./src/app_refactor.js"></script>

  <script>
    const app = document.getElementById('app');
    const sidebar = document.getElementById('sidebar');
    const openBtn  = document.getElementById('open-menu');
    const toggleBtn = document.getElementById('toggle-nav');
    openBtn?.addEventListener('click', () => sidebar.classList.toggle('open'));
    toggleBtn?.addEventListener('click', () => {
      if (window.matchMedia('(max-width: 1024px)').matches) {
        sidebar.classList.toggle('open');
      } else {
        app.classList.toggle('sidebar-hidden');
      }
    });
  </script>
</body>
</html>
